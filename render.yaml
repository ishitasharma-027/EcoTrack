services:
  - type: web
    name: ecotrack-api
    runtime: python
    plan: starter
    buildCommand: bash backend/render-build.sh
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DOCS_ENABLED
        value: "false"
      - key: MONGODB_DB
        value: ecotrack
      - key: ILLEGAL_WASTE_MODEL
        value: ../AI/illegal_waste/best.pt
      - key: SEGREGATION_MODEL
        value: ../AI/segregation/best_model_epoch_12.pth
      - key: UPLOAD_DIR
        value: ../uploads
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
